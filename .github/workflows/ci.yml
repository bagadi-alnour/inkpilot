name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # AI SDK 7 (the server entry's peer) requires Node 22+.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --ext .ts,.tsx

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # Client/server import boundary and the client gzip budget.
      - name: Check bundle
        run: npm run check:bundle

  # The root tsconfig excludes `examples/`, so example code is only type checked here.
  typecheck-examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Examples depend on the package via `file:../../`, so its dist types must exist first.
      - name: Build package
        run: npm run build

      - name: Type check examples
        run: |
          for example in examples/*/; do
            echo "::group::$example"
            (cd "$example" && npm ci && npm run typecheck)
            echo "::endgroup::"
          done
